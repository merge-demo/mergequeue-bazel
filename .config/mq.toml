mode = "parallelqueue"
build = "bazel"

[trunk]
api = "api.trunk.io"

[git]
name = "trunk bot"
email = "bot@trunk.io"

[test]
flake_rate = 0.01
# how long test should spin for (can be described as 10s, 7m, 1hr).
# pr.yaml adds 0-5m of random jitter on top, so merge tests take 10-15m.
sleep_for = "10m"

[pullrequest]
labels = ""                     # label to apply to pull request on creation (comma separated list)
comment = ""
# Target: 200 PRs/hr total, from 4 parallel generators in factory.yaml (~50/hr each).
# mq waits the full interval *after* each PR, and creating a PR takes ~35-40s, so the
# interval must be shortened to hit the real rate: 103/hr over 29m = 50 PRs, one every
# 35s; 35s wait + ~37s creation = ~72s/PR = ~60m per run, matching the hourly cron.
requests_per_hour = 103
run_generate_for = "29 minutes"
change_code_path = "bazel"

# how to distribute changes of impacted deps
# 75% - 1 dep change
# 15% - 2 dep change
# 9%  - 3 deps
# 1% - ALL will be specified
deps_distribution = "0.55x1,0.35x2,0.09x3,0.01xALL"

# rate at which PRs should simulate a logical merge conflict and need to be rejected
logical_conflict_every = 100
logical_conflict_file = "logical-conflict.txt"

close_stale_after = "48 hours"

[merge]
# trigger = "api"
# label to apply to pull request to queue
labels = ""
# comment to post to queue
comment = "/trunk merge"
