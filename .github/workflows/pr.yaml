name: PR Testing
run-name: PR Checks for ${{ github.head_ref }}
on:
  pull_request: {}

concurrency:
  group: pr-test-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  dynamic-ci-filter:
    name: Dynamic CI Filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test: ${{ steps.ci-filter.outputs.test }}
    steps:
      - name: Run Dynamic CI Filter
        id: ci-filter
        uses: trunk-io/dynamic-ci-filter@v1
        with:
          token: ${{ secrets.TRUNK_PROD_ORG_API_TOKEN }}

  test:
    name: run tests on PR
    runs-on: ubuntu-latest
    needs: [dynamic-ci-filter]
    if: >-
      !cancelled() && needs.dynamic-ci-filter.outputs.test != 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: robinraju/release-downloader@v1.13
        with:
          repository: trunk-io/mergequeue-tool
          latest: true
          preRelease: false
          fileName: mq-*-x86_64-unknown-linux-gnu.tar.gz
          extract: true

      - name: Determine is_merge
        id: check_is_merge
        run: |
          if [[ ${HEAD_REF} == trunk-merge/* || ${HEAD_REF} == trunk-merge-beta/* || ${PR_TITLE} == trunk-merge/* ]]; then
            echo "on_merge=true" >> $GITHUB_OUTPUT
          else
            echo "on_merge=false" >> $GITHUB_OUTPUT
          fi
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: run tests
        id: test
        # only actually run the test if we're on the merge branch
        # so we can simulate delay and flakiness
        if: steps.check_is_merge.outputs.on_merge == 'true'
        run: |
          ./mq test-sim
        env:
          IS_MERGE: ${{ steps.check_is_merge.outputs.on_merge }}
