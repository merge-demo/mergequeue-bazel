name: PR Testing
run-name: PR Checks for ${{ github.ref_name }}
# pull_request only. Don't add a push trigger: Trunk pushes the commit it tests to trunk-temp/*
# while building the merge branch, and a push run would report "run tests on PR" on that SHA
# without running the test sim, letting the queue merge early.
on:
  pull_request: {}

concurrency:
  group: pr-test-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  dynamic-ci-filter:
    name: Dynamic CI Filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      test: ${{ steps.ci-filter.outputs.test }}
    steps:
      - name: Run Dynamic CI Filter
        id: ci-filter
        uses: trunk-io/dynamic-ci-filter@v1
        with:
          token: ${{ secrets.TRUNK_PROD_ORG_API_TOKEN }}

  test:
    name: run tests on PR
    runs-on: ubuntu-latest
    needs: [dynamic-ci-filter]
    if: >-
      !cancelled() && needs.dynamic-ci-filter.outputs.test != 'false'
    env:
      IS_MERGE: ${{ startsWith(github.head_ref, 'trunk-merge/') || startsWith(github.head_ref, 'trunk-merge-beta/') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Only simulate the test (delay + flakiness) on the queue's trunk-merge/* PRs;
      # regular PRs pass immediately.
      - uses: robinraju/release-downloader@v1.13
        if: env.IS_MERGE == 'true'
        with:
          repository: trunk-io/mergequeue-tool
          latest: true
          preRelease: false
          fileName: mq-*-x86_64-unknown-linux-gnu.tar.gz
          extract: true

      # sleep_for in .config/mq.toml is fixed; add 0-5m of jitter so tests take 10-15m.
      - name: test time jitter
        if: env.IS_MERGE == 'true'
        run: |
          jitter=$((RANDOM % 301))
          echo "adding ${jitter}s of jitter"
          sleep "${jitter}"

      - name: run tests
        id: test
        if: env.IS_MERGE == 'true'
        run: ./mq test-sim
